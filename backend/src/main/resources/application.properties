spring.application.name=stockflow-backend

# Conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/stockflow_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Primera incorporación de Flyway a nuestra BD existente
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

stockflow.security.admin-password=${STOCKFLOW_ADMIN_PASSWORD}
stockflow.security.employee-password=${STOCKFLOW_EMPLOYEE_PASSWORD}
